# Continuous integration for develop and main.
# Add lint, build, deploy, and other jobs here as the project grows.
name: CI

on:
  push:
    branches:
      - develop
      - main
      - db-integration
  pull_request:
    branches:
      - develop
      - main
      - db-integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (web, with coverage)
        run: pnpm web:test:coverage
        env:
          # authors-api.test.ts uses mongodb-memory-server (ephemeral, no external DB).
          MONGODB_URI: mongodb://127.0.0.1:27017/andromeda-ci

      # Future steps: pnpm lint, pnpm build, pnpm contracts:test, deploy previews, etc.
