# Continuous integration for develop and main.
# Lint, typecheck, React Doctor, tests, build, and dependency audit run on every push and pull request.
name: CI

on:
  push:
    branches:
      - develop
      - main
      - db-integration
  pull_request:
    branches:
      - develop
      - main
      - db-integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache MongoDB memory server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: React Doctor
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$BASE_REF"
          pnpm react-doctor:ci
        env:
          REACT_DOCTOR_DIFF_BASE: origin/${{ github.event.pull_request.base.ref || 'main' }}

      - name: Unit tests (web, with coverage)
        run: pnpm web:test:coverage

      - name: Build web app
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Contract build
        run: pnpm contracts:build
