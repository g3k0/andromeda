# Continuous integration for develop and main.
# Add lint, build, deploy, and other jobs here as the project grows.
name: CI

on:
  push:
    branches:
      - develop
      - main
      - db-integration
  pull_request:
    branches:
      - develop
      - main
      - db-integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (web, with coverage)
        run: pnpm web:test:coverage

      - name: Build web app
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Contract build
        run: pnpm contracts:build
